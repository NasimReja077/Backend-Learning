<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM Token & Context Simulator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 200px; font-size: 16px; }
    select, button { margin: 10px 0; padding: 8px 16px; font-size: 16px; }
    .result { background: #f5f5f5; padding: 16px; border-radius: 8px; margin-top: 20px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>LLM Token & Context Simulator</h1>

  <textarea id="text" placeholder="Paste any text here..."></textarea>

  <div>
    <label>Context Window: </label>
    <select id="contextSize">
      <option value="128000">128K</option>
      <option value="200000">200K</option>
      <option value="1000000" selected>1M</option>
      <option value="2000000">2M</option>
    </select>
  </div>

  <button onclick="analyze()">Analyze</button>

  <div id="result" class="result">Results will appear here...</div>

  <script type="module">
    import { countTokens } from 'https://cdn.jsdelivr.net/npm/gpt-tokenizer@latest/esm/main.js';

    window.analyze = function() {
      const text = document.getElementById('text').value;
      const maxContext = Number(document.getElementById('contextSize').value);
      const tokens = countTokens(text);
      const remaining = maxContext - tokens;
      const usagePct = (tokens / maxContext) * 100;

      let message = `Text length      : ${text.length.toLocaleString()} characters
Token count      : ${tokens.toLocaleString()} tokens
Context window   : ${maxContext.toLocaleString()} tokens
Used             : ${usagePct.toFixed(2)}%
Remaining        : ${remaining.toLocaleString()} tokens`;

      if (tokens > maxContext) {
        message += "\n\n⚠️ WARNING: Exceeds context window!";
      } else if (usagePct > 80) {
        message += "\n\n⚠️ High usage — leave room for the response.";
      } else {
        message += "\n\n✅ Comfortable margin left.";
      }

      document.getElementById('result').textContent = message;
    };
  </script>
</body>
</html>
